<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Pen Fight — Bench Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-base:#a9764f;
    --wood-dark:#7a4e2c;
    --wood-light:#c99464;
    --paper:#f3ecd9;
    --ink-p1:#2452c4;
    --ink-p1-dark:#173a91;
    --ink-p2:#c4302b;
    --ink-p2-dark:#8f1f1b;
    --graphite:#2b2723;
    --pencil-yellow:#e8b23c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:#3a2b1c;
    font-family:'Kalam', cursive;
    color:var(--graphite);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px;
  }
  .sheet{
    width:100%;
    max-width:820px;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 18px 40px rgba(0,0,0,0.5), 0 0 0 2px rgba(0,0,0,0.15) inset;
    padding:14px 16px 10px;
    position:relative;
    background-image:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(transparent, transparent 27px, rgba(70,90,160,0.14) 28px);
  }
  .sheet::before{
    content:"";
    position:absolute; left:34px; top:0; bottom:0;
    width:2px; background:rgba(196,48,43,0.35);
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding-left:24px;
    margin-bottom:4px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Permanent Marker', cursive;
    font-size:clamp(22px,4.5vw,32px);
    margin:0;
    color:var(--graphite);
    transform:rotate(-1.5deg);
    letter-spacing:1px;
  }
  .score-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:15px;
  }
  .score-pill{
    display:flex; align-items:center; gap:6px;
    background:#fff;
    border:2px solid var(--graphite);
    border-radius:16px;
    padding:3px 12px 3px 8px;
    box-shadow:2px 2px 0 rgba(0,0,0,0.15);
  }
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .dot.p1{background:var(--ink-p1);}
  .dot.p2{background:var(--ink-p2);}
  .score-num{font-weight:700; font-size:18px;}
  .round-tag{
    font-size:13px; opacity:0.75; padding-left:24px;
    margin-bottom:2px;
  }
  .stage{
    position:relative;
    margin-left:24px;
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,0.35) inset, 0 0 0 3px var(--wood-dark);
    touch-action:none;
    cursor:grab;
  }
  canvas{ display:block; width:100%; height:auto; }
  .banner{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px;
    background:rgba(20,14,8,0.55);
    color:#fff;
    text-align:center;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    font-family:'Permanent Marker', cursive;
    padding:20px;
  }
  .banner.show{ opacity:1; pointer-events:auto; }
  .banner .big{ font-size:clamp(24px,5vw,38px); text-shadow:0 3px 0 rgba(0,0,0,0.4); }
  .banner .small{ font-family:'Kalam',cursive; font-size:15px; opacity:0.9; max-width:340px; }
  button.action{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:15px;
    background:var(--pencil-yellow);
    color:var(--graphite);
    border:2px solid var(--graphite);
    border-radius:10px;
    padding:8px 18px;
    cursor:pointer;
    box-shadow:2px 3px 0 rgba(0,0,0,0.5);
    transition:transform .08s ease;
  }
  button.action:active{ transform:translateY(2px); box-shadow:1px 1px 0 rgba(0,0,0,0.5); }
  footer{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 6px 2px 24px;
    gap:10px;
    flex-wrap:wrap;
  }
  .hint{ font-size:13px; opacity:0.7; }
  .turn-indicator{
    display:flex; align-items:center; gap:6px;
    font-size:14px; font-weight:700;
  }
  .turn-indicator .dot{width:10px;height:10px;}
  #resetBtn{ font-size:13px; padding:5px 12px; }
  @media (max-width:480px){
    .sheet{padding:10px 10px 6px;}
    header, .round-tag, .stage, footer{ margin-left:20px; padding-left:0; }
    .sheet::before{ left:26px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="sheet">
    <header>
      <h1>Pen Fight</h1>
      <div class="score-row">
        <div class="score-pill"><span class="dot p1"></span><span class="score-num" id="scoreP1">0</span></div>
        <span style="opacity:.5">vs</span>
        <div class="score-pill"><span class="score-num" id="scoreP2">0</span><span class="dot p2"></span></div>
      </div>
    </header>
    <div class="round-tag">Round <span id="roundNum">1</span> · First to 3 wins the fight</div>

    <div class="stage" id="stage">
      <canvas id="game" width="760" height="380"></canvas>
      <div class="banner" id="banner">
        <div class="big" id="bannerBig">Round 1</div>
        <div class="small" id="bannerSmall">Blue goes first. Drag your pen backward and let go to flick it.</div>
        <button class="action" id="bannerBtn">Start</button>
      </div>
    </div>

    <footer>
      <div class="turn-indicator" id="turnIndicator"><span class="dot p1"></span> Blue's turn — drag your pen</div>
      <div class="hint">pull back &amp; release to flick, like a pencil-case duel</div>
      <button class="action" id="resetBtn">New Match</button>
    </footer>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const stage = document.getElementById('stage');
  const banner = document.getElementById('banner');
  const bannerBig = document.getElementById('bannerBig');
  const bannerSmall = document.getElementById('bannerSmall');
  const bannerBtn = document.getElementById('bannerBtn');
  const scoreP1El = document.getElementById('scoreP1');
  const scoreP2El = document.getElementById('scoreP2');
  const roundNumEl = document.getElementById('roundNum');
  const turnIndicator = document.getElementById('turnIndicator');
  const resetBtn = document.getElementById('resetBtn');

  const MARGIN = 26; // desk edge margin - going beyond this = falling off
  const PEN_LEN = 46, PEN_W = 11, RADIUS = 15;
  const FRICTION = 0.983;
  const ANG_FRICTION = 0.95;
  const STOP_THRESH = 0.06;
  const MAX_PULL = 110;
  const POWER_SCALE = 0.17;
  const WIN_SCORE = 3;

  let pens, turn, round, scores, isSimulating, matchOver, dragging, dragStart, dragCurrent, fallenIndex, roundLocked;

  function initDesk(){
    pens = [
      { x: W*0.24, y: H*0.5, vx:0, vy:0, angle: 0.06, angVel:0, color: getComputedStyle(document.documentElement).getPropertyValue('--ink-p1').trim(), dark: getComputedStyle(document.documentElement).getPropertyValue('--ink-p1-dark').trim(), alive:true, fallProgress:0 },
      { x: W*0.76, y: H*0.5, vx:0, vy:0, angle: Math.PI-0.06, angVel:0, color: getComputedStyle(document.documentElement).getPropertyValue('--ink-p2').trim(), dark: getComputedStyle(document.documentElement).getPropertyValue('--ink-p2-dark').trim(), alive:true, fallProgress:0 }
    ];
  }

  function resetMatch(){
    scores = [0,0];
    round = 1;
    turn = 0;
    matchOver = false;
    updateScores();
    startRound(true);
  }

  function startRound(showIntro){
    initDesk();
    isSimulating = false;
    roundLocked = false;
    fallenIndex = -1;
    roundNumEl.textContent = round;
    updateTurnIndicator();
    if(showIntro){
      showBanner('Round '+round, (turn===0?'Blue':'Red')+' goes first. Drag your pen backward and let go to flick it.', 'Start');
    }
  }

  function updateScores(){
    scoreP1El.textContent = scores[0];
    scoreP2El.textContent = scores[1];
  }

  function updateTurnIndicator(){
    if(matchOver) return;
    const cls = turn===0 ? 'p1':'p2';
    const name = turn===0 ? 'Blue' : 'Red';
    turnIndicator.innerHTML = '<span class="dot '+cls+'"></span> '+name+'\'s turn — drag your pen';
  }

  function showBanner(big, small, btnText){
    bannerBig.textContent = big;
    bannerSmall.textContent = small;
    bannerBtn.textContent = btnText;
    banner.classList.add('show');
  }
  function hideBanner(){ banner.classList.remove('show'); }

  bannerBtn.addEventListener('click', ()=>{
    if(matchOver){ resetMatch(); }
    hideBanner();
  });
  resetBtn.addEventListener('click', ()=>{ resetMatch(); hideBanner(); });

  // ---------- Drawing ----------
  function drawWoodDesk(){
    ctx.fillStyle = '#a9764f';
    ctx.fillRect(0,0,W,H);
    // planks
    const plankH = 62;
    for(let y=0;y<H;y+=plankH){
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    // grain streaks
    ctx.save();
    ctx.globalAlpha = 0.18;
    for(let i=0;i<26;i++){
      const gy = (i*37 + 13) % H;
      const amp = 6 + (i%5);
      ctx.strokeStyle = i%2===0 ? '#7a4e2c' : '#c99464';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for(let x=0;x<=W;x+=20){
        const yy = gy + Math.sin((x+i*40)/60)*amp;
        if(x===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }
    ctx.restore();
    // desk edge (danger zone) markers
    ctx.save();
    ctx.strokeStyle = 'rgba(255,235,180,0.55)';
    ctx.setLineDash([8,7]);
    ctx.lineWidth = 2;
    ctx.strokeRect(MARGIN, MARGIN, W-2*MARGIN, H-2*MARGIN);
    ctx.restore();
    // vignette for edge of table
    const grad = ctx.createRadialGradient(W/2,H/2, H*0.25, W/2,H/2, H*0.85);
    grad.addColorStop(0,'rgba(0,0,0,0)');
    grad.addColorStop(1,'rgba(0,0,0,0.35)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
  }

  function drawPen(p){
    if(!p.alive && p.fallProgress>=1) return;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    let scale = 1, alpha = 1;
    if(!p.alive){
      scale = Math.max(0, 1 - p.fallProgress);
      alpha = scale;
    }
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    // shadow
    ctx.save();
    ctx.translate(3,4);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    roundedRect(-PEN_LEN/2, -PEN_W/2, PEN_LEN, PEN_W, 5);
    ctx.fill();
    ctx.restore();
    // body
    ctx.fillStyle = p.color;
    roundedRect(-PEN_LEN/2, -PEN_W/2, PEN_LEN*0.72, PEN_W, 4);
    ctx.fill();
    // tip
    ctx.fillStyle = p.dark;
    ctx.beginPath();
    ctx.moveTo(PEN_LEN*0.22, -PEN_W/2);
    ctx.lineTo(PEN_LEN/2, 0);
    ctx.lineTo(PEN_LEN*0.22, PEN_W/2);
    ctx.closePath();
    ctx.fill();
    // clip
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(-PEN_LEN*0.05, -PEN_W/2-3, PEN_LEN*0.16, 3.5);
    // highlight stripe
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(-PEN_LEN/2+3, -PEN_W/2+2, PEN_LEN*0.6, 2);
    ctx.restore();
  }

  function roundedRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawAimLine(){
    if(!dragging) return;
    const p = pens[turn];
    let dx = dragCurrent.x - dragStart.x;
    let dy = dragCurrent.y - dragStart.y;
    let dist = Math.hypot(dx,dy);
    if(dist>MAX_PULL){ const s=MAX_PULL/dist; dx*=s; dy*=s; dist=MAX_PULL; }
    const power = dist/MAX_PULL;
    // aim direction is opposite the drag (slingshot)
    const aimX = p.x - dx;
    const aimY = p.y - dy;
    ctx.save();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 3;
    ctx.setLineDash([6,6]);
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(aimX, aimY);
    ctx.stroke();
    ctx.setLineDash([]);
    // power arrow head
    ctx.beginPath();
    ctx.arc(aimX, aimY, 5+power*4, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.9;
    ctx.fill();
    ctx.restore();

    // power meter bar
    ctx.save();
    const barW = 90, barH = 8, bx = p.x-barW/2, by = p.y - 34;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundedRect(bx,by,barW,barH,4); ctx.fill();
    ctx.fillStyle = p.color;
    roundedRect(bx,by,barW*power,barH,4); ctx.fill();
    ctx.restore();
  }

  // ---------- Physics ----------
  function stepPhysics(){
    let moving = false;
    for(const p of pens){
      if(!p.alive){
        p.fallProgress += 0.045;
        p.x += p.vx*0.4; p.y += p.vy*0.4;
        moving = moving || p.fallProgress < 1;
        continue;
      }
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= FRICTION;
      p.vy *= FRICTION;
      p.angle += p.angVel;
      p.angVel *= ANG_FRICTION;
      if(Math.hypot(p.vx,p.vy) > STOP_THRESH) moving = true;
    }

    // collision between the two pens (only if both alive)
    if(pens[0].alive && pens[1].alive){
      const a = pens[0], b = pens[1];
      const dx = b.x-a.x, dy = b.y-a.y;
      const dist = Math.hypot(dx,dy);
      const minDist = RADIUS*2*0.72;
      if(dist < minDist && dist>0){
        const nx = dx/dist, ny = dy/dist;
        // separate
        const overlap = (minDist-dist)/2;
        a.x -= nx*overlap; a.y -= ny*overlap;
        b.x += nx*overlap; b.y += ny*overlap;
        // relative velocity along normal
        const rvx = b.vx-a.vx, rvy = b.vy-a.vy;
        const velAlongNormal = rvx*nx+rvy*ny;
        if(velAlongNormal < 0){
          const restitution = 0.92;
          const impulse = -(1+restitution)*velAlongNormal/2;
          a.vx -= impulse*nx; a.vy -= impulse*ny;
          b.vx += impulse*nx; b.vy += impulse*ny;
          a.angVel += (Math.random()-0.5)*0.08;
          b.angVel += (Math.random()-0.5)*0.08;
        }
        // face travel direction a bit
        moving = true;
      }
    }

    // check for falling off desk
    for(let i=0;i<pens.length;i++){
      const p = pens[i];
      if(p.alive && (p.x < MARGIN-6 || p.x > W-MARGIN+6 || p.y < MARGIN-6 || p.y > H-MARGIN+6)){
        p.alive = false;
        fallenIndex = i;
      }
      if(p.alive){
        // orient pen roughly along velocity when moving fast
        const speed = Math.hypot(p.vx,p.vy);
        if(speed > 0.4){
          p.angle = Math.atan2(p.vy,p.vx);
        }
      }
    }

    return moving;
  }

  function endRoundIfNeeded(){
    if(fallenIndex !== -1 && !roundLocked){
      roundLocked = true;
      const winner = fallenIndex === 0 ? 1 : 0;
      scores[winner]++;
      updateScores();
      setTimeout(()=>{
        if(scores[winner] >= WIN_SCORE){
          matchOver = true;
          const name = winner===0 ? 'Blue' : 'Red';
          showBanner(name+' wins the fight!', 'Final score '+scores[0]+' – '+scores[1]+'. Tap to duel again.', 'Rematch');
        } else {
          round++;
          turn = winner; // loser's opponent... actually give next start to the round loser to balance
          turn = fallenIndex; // player who fell off starts next round
          startRound(true);
        }
      }, 900);
    }
  }

  // ---------- Input ----------
  function getPointerPos(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX-rect.left) * (W/rect.width),
      y: (clientY-rect.top) * (H/rect.height)
    };
  }

  function onDown(e){
    if(isSimulating || matchOver || roundLocked) return;
    const pos = getPointerPos(e);
    const p = pens[turn];
    const d = Math.hypot(pos.x-p.x, pos.y-p.y);
    if(d < RADIUS*2.2){
      dragging = true;
      dragStart = {x:p.x, y:p.y};
      dragCurrent = pos;
      stage.style.cursor = 'grabbing';
      e.preventDefault();
    }
  }
  function onMove(e){
    if(!dragging) return;
    dragCurrent = getPointerPos(e);
    e.preventDefault();
  }
  function onUp(e){
    if(!dragging) return;
    dragging = false;
    stage.style.cursor = 'grab';
    const p = pens[turn];
    let dx = dragCurrent.x - dragStart.x;
    let dy = dragCurrent.y - dragStart.y;
    let dist = Math.hypot(dx,dy);
    if(dist > MAX_PULL){ const s = MAX_PULL/dist; dx*=s; dy*=s; dist = MAX_PULL; }
    if(dist < 8){ return; } // too small a flick, ignore
    p.vx = -dx * POWER_SCALE;
    p.vy = -dy * POWER_SCALE;
    p.angVel = (Math.random()-0.5)*0.05;
    isSimulating = true;
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchmove', onMove, {passive:false});
  canvas.addEventListener('touchend', onUp);

  // ---------- Main loop ----------
  function loop(){
    ctx.clearRect(0,0,W,H);
    drawWoodDesk();
    for(const p of pens) drawPen(p);
    drawAimLine();

    if(isSimulating){
      const moving = stepPhysics();
      endRoundIfNeeded();
      if(!moving && fallenIndex === -1){
        isSimulating = false;
        turn = 1-turn;
        updateTurnIndicator();
      }
    }
    requestAnimationFrame(loop);
  }

  resetMatch();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
